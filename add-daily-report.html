<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Daily Report - Project Control System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top-header">
    <div>
        <h1>PROJECT CONTROL SYSTEM</h1>
        <p>Digital Project Monitoring & Reporting Prototype</p>
    </div>

    <a href="daily-monitoring.html" class="back-button">
        ← Back
    </a>
</header>


<main class="container">

    <div class="page-header">
        <div>
            <h2>Add Daily Report</h2>
            <p>Input daily field activities and project conditions.</p>
        </div>
    </div>


    <form class="report-form">

        <!-- BASIC INFORMATION -->
        <div class="content-card">

            <h3 class="section-title">
                📋 Basic Information
            </h3>

            <div class="form-grid">

                <div class="form-group">
                    <label>Date</label>
                    <input
                        type="date"
                        id="reportDate"
                        required
                    >
                </div>


                <div class="form-group">
                    <label>Location</label>

                    <select id="location" required>

                        <option value="">
                            Select Location
                        </option>

                        <option value="Kalimantan">
                            Kalimantan
                        </option>

                        <option value="Tasikmalaya">
                            Tasikmalaya
                        </option>

                    </select>

                </div>


                <div class="form-group">
                    <label>Project</label>

                    <select id="project" required>

                        <option value="">
                            Select Project
                        </option>

                    </select>

                </div>


                <div class="form-group">
                    <label>Unit</label>

                    <select id="unit" required>

                        <option value="">
                            Select Unit
                        </option>

                    </select>

                </div>


                <div class="form-group">
                    <label>Weather</label>

                    <select id="weather" required>

                        <option value="">
                            Select Weather
                        </option>

                        <option value="Clear">
                            Clear
                        </option>

                        <option value="Cloudy">
                            Cloudy
                        </option>

                        <option value="Rain">
                            Rain
                        </option>

                        <option value="Heavy Rain">
                            Heavy Rain
                        </option>

                    </select>

                </div>

            </div>

        </div>


        <!-- MANPOWER -->
        <div class="content-card">

            <h3 class="section-title">
                👷 Manpower
            </h3>

            <div class="form-grid">

                <div class="form-group">
                    <label>Foreman</label>

                    <input
                        type="number"
                        id="foreman"
                        min="0"
                        placeholder="People"
                    >

                </div>


                <div class="form-group">
                    <label>Head Worker</label>

                    <input
                        type="number"
                        id="headWorker"
                        min="0"
                        placeholder="People"
                    >

                </div>


                <div class="form-group">
                    <label>Skilled Worker</label>

                    <input
                        type="number"
                        id="skilledWorker"
                        min="0"
                        placeholder="People"
                    >

                </div>


                <div class="form-group">
                    <label>Staff Office</label>

                    <input
                        type="number"
                        id="staffOffice"
                        min="0"
                        placeholder="People"
                    >

                </div>

            </div>


            <div class="form-grid">

                <div class="form-group">
                    <label>Normal Working Hours / Person</label>

                    <input
                        type="number"
                        id="normalHours"
                        min="0"
                        max="8"
                        step="0.5"
                        value="8"
                    >

                </div>


                <div class="form-group">
                    <label>Overtime Hours / Person</label>

                    <input
                        type="number"
                        id="overtimeHours"
                        min="0"
                        step="0.5"
                        value="0"
                    >

                </div>

            </div>

        </div>


        <!-- WORK ACTIVITIES -->
        <div class="content-card">

            <h3 class="section-title">
                🏗️ Work Activities
            </h3>


            <div class="form-group">

                <label>Activity</label>

                <textarea
                    id="activity"
                    rows="4"
                    placeholder="Example: Column reinforcement fabrication, column formwork installation, concrete casting..."
                ></textarea>

            </div>


            <div class="form-group">

                <label>Status</label>

                <select id="status">

                    <option value="On Progress">
                        On Progress
                    </option>

                    <option value="Completed">
                        Completed
                    </option>

                    <option value="Delayed">
                        Delayed
                    </option>

                    <option value="Not Started">
                        Not Started
                    </option>

                </select>

            </div>

        </div>


        <!-- MATERIAL -->
        <div class="content-card">

            <h3 class="section-title">
                🧱 Material
            </h3>


            <div id="materialContainer">

                <div class="material-row">

                    <div class="form-group">

                        <label>Material</label>

                        <input
                            type="text"
                            class="material-name"
                            placeholder="Example: Cement, sand, rebar..."
                        >

                    </div>


                    <div class="form-group">

                        <label>Quantity</label>

                        <input
                            type="number"
                            class="material-quantity"
                            min="0"
                            step="0.01"
                            placeholder="Quantity"
                        >

                    </div>


                    <div class="form-group">

                        <label>Unit</label>

                        <select class="material-unit">

                            <option value="">
                                Select Unit
                            </option>

                            <option>kg</option>
                            <option>ton</option>
                            <option>m³</option>
                            <option>m²</option>
                            <option>pcs</option>
                            <option>batang</option>
                            <option>sak</option>
                            <option>lembar</option>
                            <option>rit</option>

                        </select>

                    </div>


                    <button
                        type="button"
                        class="remove-material-btn"
                    >
                        Remove
                    </button>

                </div>

            </div>


            <button
                type="button"
                id="addMaterialBtn"
                class="secondary-button"
            >
                + Add Material
            </button>

        </div>


        <!-- NOTES -->
        <div class="content-card">

            <h3 class="section-title">
                📝 Daily Notes
            </h3>


            <div class="form-group">

                <label>Notes / Field Condition</label>

                <textarea
                    id="notes"
                    rows="5"
                    placeholder="Example: Acian hampir selesai. Material cat dasar dan alat sudah tersedia di lokasi."
                ></textarea>

            </div>

        </div>


        <!-- BUTTON -->
        <div class="form-actions">

            <a
                href="daily-monitoring.html"
                class="secondary-button"
            >
                Cancel
            </a>


            <button
                type="submit"
                class="primary-button"
            >
                Save Daily Report
            </button>

        </div>

    </form>

</main>


<script src="daily-report.js"></script>

</body>
</html>
